name: click-hub

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: "${DB_NAME:-clickhub}"
      POSTGRES_USER: "${DB_USERNAME:-clickhub}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-clickhub-local}"
    ports:
      - "${DATABASE_PORT:-5432}:5432"
    volumes:
      - "${DB_DATA_PATH:-./db/data}:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8080}"
    image: click-hub-frontend:local
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: click-hub-backend:local
    environment:
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:5173}"
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: "${DB_NAME:-clickhub}"
      DB_USERNAME: "${DB_USERNAME:-clickhub}"
      DB_PASSWORD: "${DB_PASSWORD:-clickhub-local}"
      DB_POOL_MAX_SIZE: "${DB_POOL_MAX_SIZE:-5}"
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-demo}"
      CLICKHUB_JWT_SECRET: "${CLICKHUB_JWT_SECRET:-local-development-secret-change-before-production-123456}"
      CLICKHUB_OAUTH2_REDIRECT_URI: "${CLICKHUB_OAUTH2_REDIRECT_URI:-http://localhost:5173/oauth/callback}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      ADMIN_LOGIN_ENABLED: "${ADMIN_LOGIN_ENABLED:-true}"
      ADMIN_USERNAME: "${ADMIN_USERNAME:-admin}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:-admin}"
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    restart: unless-stopped
