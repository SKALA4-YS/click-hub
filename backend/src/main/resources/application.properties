spring.application.name=ClickHub
server.port=${PORT:8080}

# --- Database (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clickhub}
spring.datasource.username=${DB_USERNAME:clickhub}
spring.datasource.password=${DB_PASSWORD:clickhub-local}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=1

# --- Schema migration ---
spring.flyway.enabled=true
spring.flyway.connect-retries=10

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- JWT ---
# 운영 환경에서는 반드시 환경변수(CLICKHUB_JWT_SECRET)로 주입할 것
clickhub.jwt.secret=${CLICKHUB_JWT_SECRET:change-this-secret-to-a-256-bit-random-value-before-deploy}
clickhub.jwt.access-token-expiration-ms=3600000
clickhub.jwt.refresh-token-expiration-ms=1209600000

# --- CORS ---
clickhub.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
