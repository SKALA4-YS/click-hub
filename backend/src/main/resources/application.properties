spring.application.name=ClickHub
server.port=${PORT:8080}

# --- Database (PostgreSQL) ---
# stringtype=unspecified 필수: PostgreSQL 네이티브 enum(user_role, project_status 등) 컬럼에
# JDBC가 기본으로 varchar 타입 파라미터를 보내면서 "column is of type xxx but expression is of
# type character varying" 오류가 나는 것을 막는다.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clickhub}?stringtype=unspecified
spring.datasource.username=${DB_USERNAME:clickhub}
spring.datasource.password=${DB_PASSWORD:clickhub-local}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=1

# --- Schema migration (Flyway) ---
# 기준 스키마는 db/migration/*.sql이다. V1은 이미 적용된 파일이므로 직접 수정하지 않고
# 변경이 필요하면 V2, V3 ... 로만 추가한다 (docs/backend-structure.md 변경 이력 참고).
spring.flyway.enabled=true
spring.flyway.connect-retries=10

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# Hibernate 7.x는 JDBC 연결이 정상일 때 dialect를 자동 감지하므로 이 줄은 사실 불필요하고
# 부팅 로그에 HHH90000025 경고가 한 줄 뜬다. 그런데도 명시적으로 남겨둔 이유는, DB 연결
# 자체가 아직 안 될 때(로컬 셋업 초기) 자동 감지 로직이 "Unable to determine Dialect without
# JDBC metadata"라는, 원인을 오히려 헷갈리게 하는 에러로 먼저 튀어나오는 걸 실제로 확인했기
# 때문이다 — 명시해두면 이런 경우에도 원래의 연결 실패 원인(비밀번호 등)이 그대로 보인다.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- JWT ---
# 운영 환경에서는 반드시 환경변수(CLICKHUB_JWT_SECRET)로 주입할 것
clickhub.jwt.secret=${CLICKHUB_JWT_SECRET:change-this-secret-to-a-256-bit-random-value-before-deploy}
clickhub.jwt.access-token-expiration-ms=3600000
clickhub.jwt.refresh-token-expiration-ms=1209600000

# --- Admin ID/password login ---
# 운영은 기본 비활성화다. 활성화할 때는 반드시 Render Secret 환경변수로 계정을 재설정한다.
# 비밀번호는 DB와 Git에 저장하지 않는다.
clickhub.admin.login.enabled=${ADMIN_LOGIN_ENABLED:false}
clickhub.admin.login.username=${ADMIN_USERNAME:}
clickhub.admin.login.password=${ADMIN_PASSWORD:}

# --- CORS ---
clickhub.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Swagger / OpenAPI (springdoc) ---
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# --- OAuth2 로그인 (GitHub / Google) ---
# 실제 client-id/secret은 application-oauth2.properties(별도 프로필)에서만 주입한다.
# Spring Boot는 spring.security.oauth2.client.registration.{id}.* 프로퍼티가 하나라도
# "존재"하면(값이 빈 문자열이어도!) 그 registration을 즉시 검증하고, client-id가 비어 있으면
# "Client id of registration 'xxx' must not be empty" 로 부팅 자체를 실패시킨다(실측 확인).
# 즉 여기(기본 application.properties)에 ${GITHUB_CLIENT_ID:} 같은 빈 기본값으로 두면
# GitHub/Google OAuth App을 아직 안 만든 로컬/CI 환경에서 앱이 아예 안 뜬다.
# 그래서 실제 credential이 있을 때만 "oauth2" 프로필로 켜도록 분리했다 — SecurityConfig도
# ClientRegistrationRepository 빈이 없으면 oauth2Login() 자체를 건너뛰도록 만들어 뒀다.
# 로컬에서 실제 로그인을 테스트하려면: SPRING_PROFILES_ACTIVE=oauth2 로 기동 + 아래 값 설정
#   GITHUB_CLIENT_ID, GITHUB_CLIENT_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET
# 콜백(redirect) URI는 기본 템플릿 그대로 사용: {baseUrl}/login/oauth2/code/{registrationId}
# 예) http://localhost:8080/login/oauth2/code/github

# 로그인 성공/실패 후 프론트엔드(SPA)로 되돌아갈 콜백 페이지. Access Token 또는 오류 코드가
# URL fragment로 붙는다. MVP1에서는 Refresh Token을 브라우저에 전달하거나 저장하지 않는다.
clickhub.oauth2.redirect-uri=${CLICKHUB_OAUTH2_REDIRECT_URI:http://localhost:5173/oauth/callback}
