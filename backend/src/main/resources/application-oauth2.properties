# 실제 Google Cloud OAuth Client를 만든 뒤에만 이 프로필을 켠다
# (SPRING_PROFILES_ACTIVE=oauth2, 다른 프로필과 함께 활성화 가능: 예 "default,oauth2").
# google은 Spring Security의 기본 제공 프로바이더라 client-id/secret/scope만 넣으면
# authorization-uri/token-uri/user-info-uri는 자동 설정된다.
#
# GitHub은 당장 안 쓰기로 해서 뺐다. Spring Boot는 registration 프로퍼티가 하나라도
# "존재"하면(값이 비어 있어도) 즉시 검증해서 부팅을 실패시키므로, 안 쓰는 프로바이더는
# 여기 아예 안 적는 게 맞다 — 나중에 GitHub도 다시 붙이려면 이 파일에 github 블록만
# 추가하면 된다(코드 쪽 CustomOAuth2UserService는 그대로 남아 있어 바로 동작한다).
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile
