name: Feature
description: 기능, 설계 또는 문서 작업을 제안합니다.
title: "[Feature] "
labels:
  - "type:feature"
body:
  - type: textarea
    id: background
    attributes:
      label: 배경
      description: 이 작업이 필요한 이유를 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: work
    attributes:
      label: 작업 내용
      description: 구현하거나 작성할 내용을 정리해 주세요.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 기준
      description: 완료 여부를 확인할 수 있는 조건을 체크리스트로 작성해 주세요.
      placeholder: "- [ ] 조건 1"
    validations:
      required: true
