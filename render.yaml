databases:
  - name: click-hub-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: clickhub
    user: clickhub
    ipAllowList: []

services:
  - type: web
    name: click-hub-backend
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeployTrigger: checksPass
    envVars:
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: CLICKHUB_OAUTH2_REDIRECT_URI
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ADMIN_LOGIN_ENABLED
        value: "false"
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SPRING_PROFILES_ACTIVE
        value: oauth2,demo
      - key: CLICKHUB_JWT_SECRET
        generateValue: true
      - key: DB_HOST
        fromDatabase:
          name: click-hub-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: click-hub-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: click-hub-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: click-hub-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: click-hub-db
          property: password
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=75.0 -XX:+ExitOnOutOfMemoryError
